services:
  postgres:
    image: postgres:16-alpine
    container_name: arquiron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arquiron
      POSTGRES_PASSWORD: arquiron_dev_password
      POSTGRES_DB: arquiron_crm
    ports:
      - "5432:5432"
    volumes:
      - arquiron_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arquiron -d arquiron_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  arquiron_postgres_data:
